<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shirakawa Kanji Dictionary</title>
  <link rel="stylesheet" href="style.css?v=810223a4d55f">
  <script src="script.js?v=6f9bb17ca69e" defer></script>
</head>
<body>
  <main>
    <h1>Shirakawa Kanji Dictionary</h1>
    <div class="toolbar" role="search">
      <label class="visually-hidden" for="search">Search kanji, meaning, or romanized reading</label>
      <input id="search" type="search" placeholder="Search kanji, meaning, or reading…" autocomplete="off" spellcheck="false" aria-controls="results">
    </div>
    <p id="results-count" class="results-count" role="status" aria-live="polite"></p>
    <div id="results" data-index-src="entries/index.json?v=4a22833bcf5e">Loading dictionary…</div>
    <noscript>Enable JavaScript to search the dictionary index. Individual entry pages can be read without it.</noscript>
  </main>
</body>
</html>
